            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('back-btn').classList.add('hidden');
            
            const container = document.getElementById('subtopics-container');
            container.innerHTML = '';
            
            subtopicsData['acids'].forEach(subtopic => {
                const title = currentLang === 'zh' ? subtopic.titleZh : subtopic.titleEn;
                const card = document.createElement('div');
                card.className = 'subtopic-card bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between';
                card.onclick = () => {
                    if (subtopic.hasSections) renderSections(subtopic.id);
                    else showRangeView(subtopic.id, subtopic.titleZh, subtopic.titleEn);
                };
                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-teal-50 flex items-center justify-center text-teal-500">
                            <i class="fas fa-book-open"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-800">${title}</h3>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                `;
                container.appendChild(card);
            });
            updateUI();
        }

        function renderSections(subtopicId) {
            currentView = 'sections';
            currentSubtopicId = subtopicId;
            
            document.getElementById('subtopic-view').classList.add('hidden');
            document.getElementById('section-view').classList.remove('hidden');
            document.getElementById('range-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
            
            const subtopic = subtopicsData['acids'].find(s => s.id === subtopicId);
            const title = currentLang === 'zh' ? subtopic.titleZh : subtopic.titleEn;
            document.getElementById('section-header-title').innerHTML = `<i class="fas fa-list-ul text-teal-400 text-3xl"></i> <span class="text-2xl">${title}</span>`;
            
            const container = document.getElementById('sections-container');
            container.innerHTML = '';
            
            if (sectionsData[subtopicId]) {
                sectionsData[subtopicId].forEach(section => {
                    const secTitle = currentLang === 'zh' ? section.titleZh : section.titleEn;
                    const qCount = questionsData[section.id] ? questionsData[section.id].length : 0;
                    const qUnit = uiStrings[currentLang].qUnit;
                    
                    const card = document.createElement('div');
                    card.className = 'section-card bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between';
                    card.onclick = () => showRangeView(section.id, section.titleZh, section.titleEn);
                    card.innerHTML = `
                        <div class="flex items-center gap-4">
                            <div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-blue-500">
                                <i class="fas fa-file-alt"></i>
                            </div>
                            <div>
                                <h3 class="text-md font-semibold text-gray-800">${secTitle}</h3>
                                <p class="text-xs text-gray-500 mt-1">${uiStrings[currentLang].total} ${qCount} ${qUnit}</p>
                            </div>
                        </div>
                        <i class="fas fa-chevron-right text-gray-400"></i>
                    `;
                    container.appendChild(card);
                });
            }
            updateUI();
        }

        function showRangeView(targetId, titleZh, titleEn) {
            currentView = 'range';
            currentRangeTargetId = targetId;
            currentRangeTitleZh = titleZh;
            currentRangeTitleEn = titleEn;
            
            document.getElementById('subtopic-view').classList.add('hidden');
            document.getElementById('section-view').classList.add('hidden');
            document.getElementById('range-view').classList.remove('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
            
            const title = currentLang === 'zh' ? titleZh : titleEn;
            document.getElementById('range-header-title').innerHTML = `<i class="fas fa-tasks text-indigo-400 text-3xl"></i> <span class="text-2xl">${title}</span>`;
            
            const container = document.getElementById('ranges-container');
            container.innerHTML = '';
            
            const questions = questionsData[targetId] || [];
            const totalQs = questions.length;
            
            if (totalQs === 0) {
                container.innerHTML = `<p class="text-gray-500 col-span-full">${uiStrings[currentLang].noQuestions}</p>`;
                return;
            }
            
            const allCard = document.createElement('button');
            allCard.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:bg-teal-50 hover:border-teal-200 transition text-center flex flex-col items-center justify-center gap-2';
            allCard.onclick = () => startQuiz(targetId, 0, totalQs);
            allCard.innerHTML = `
                <i class="fas fa-layer-group text-2xl text-teal-500"></i>
                <span class="font-semibold text-gray-700">${uiStrings[currentLang].allQuestions}</span>
                <span class="text-xs text-gray-500">(1 - ${totalQs})</span>
            `;
            container.appendChild(allCard);
            
            const rangeSize = 10;
            for (let i = 0; i < totalQs; i += rangeSize) {
                const start = i + 1;
                const end = Math.min(i + rangeSize, totalQs);
                const card = document.createElement('button');
                card.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:bg-blue-50 hover:border-blue-200 transition text-center flex flex-col items-center justify-center gap-2';
                card.onclick = () => startQuiz(targetId, i, end);
                card.innerHTML = `
                    <i class="fas fa-list-ol text-2xl text-blue-500"></i>
                    <span class="font-semibold text-gray-700">Q${start} - Q${end}</span>
                `;
                container.appendChild(card);
            }
            
            document.getElementById('custom-range-start').max = totalQs;
            document.getElementById('custom-range-end').max = totalQs;
            document.getElementById('custom-range-end').value = totalQs;
            
            updateUI();
        }

        function startCustomQuiz() {
            const startVal = parseInt(document.getElementById('custom-range-start').value);
            const endVal = parseInt(document.getElementById('custom-range-end').value);
            const totalQs = questionsData[currentRangeTargetId] ? questionsData[currentRangeTargetId].length : 0;
            
            if (isNaN(startVal) || isNaN(endVal) || startVal < 1 || endVal > totalQs || startVal > endVal) {
                showModal(uiStrings[currentLang].invalidRange);
                return;
            }
            
            startQuiz(currentRangeTargetId, startVal - 1, endVal);
        }

        function startQuiz(targetId, startIndex, endIndex) {
            currentView = 'quiz';
            const allQs = questionsData[targetId] || [];
            currentQuestions = allQs.slice(startIndex, endIndex);
            currentGlobalOffset = startIndex;
            
            if (currentQuestions.length === 0) {
                showModal(uiStrings[currentLang].noQuestions);
                return;
            }
            
            currentQuestionIndex = 0;
            userAnswers = new Array(currentQuestions.length).fill(null);
            
            document.getElementById('range-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('question-container').classList.remove('hidden');
            document.getElementById('quiz-controls').classList.remove('hidden');
            
            const title = currentLang === 'zh' ? currentRangeTitleZh : currentRangeTitleEn;
            document.getElementById('ui-title').innerText = title;
            
            updateQuestionSelector();
            renderQuestion();
        }

        function updateQuestionSelector() {
            const selector = document.getElementById('question-selector');
            selector.innerHTML = '';
            for (let i = 0; i < currentQuestions.length; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.text = (currentGlobalOffset + i + 1).toString();
                selector.appendChild(opt);
            }
            document.getElementById('question-total-text').innerText = `/ ${currentGlobalOffset + currentQuestions.length}`;
        }

        function jumpToQuestion(index) {
            currentQuestionIndex = parseInt(index);
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestions[currentQuestionIndex];
            const qText = currentLang === 'zh' ? q.questionZh : q.questionEn;
            const options = currentLang === 'zh' ? q.optionsZh : q.optionsEn;
            
            document.getElementById('question-selector').value = currentQuestionIndex;
            document.getElementById('question-text').innerHTML = qText;
            
            const imgContainer = document.getElementById('question-image-container');
            if (q.image) {
                imgContainer.innerHTML = `<img src="${q.image}" alt="Question Image" class="max-w-full h-auto rounded-lg border border-gray-200 shadow-sm max-h-64 object-contain">`;
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.innerHTML = '';
                imgContainer.classList.add('hidden');
            }
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            const labels = ['A', 'B', 'C', 'D', 'E', 'F'];
            
            options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-xl border border-gray-200 hover:bg-slate-50 flex items-start gap-3';
                
                const isAnswered = userAnswers[currentQuestionIndex] !== null;
                const isSelected = userAnswers[currentQuestionIndex] === idx;
                const isCorrect = q.answer === idx;
                
                if (isAnswered) {
                    btn.disabled = true;
                    if (isSelected && isCorrect) {
                        btn.classList.add('correct');
                    } else if (isSelected && !isCorrect) {
                        btn.classList.add('wrong');
                    } else if (!isSelected && isCorrect) {
                        btn.classList.add('correct');
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }
                
                let iconHtml = `<div class="flex-shrink-0 w-6 h-6 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center text-sm font-bold mt-0.5">${labels[idx]}</div>`;
                if (isAnswered) {
                    if (isSelected && isCorrect) iconHtml = `<div class="flex-shrink-0 w-6 h-6 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-sm mt-0.5"><i class="fas fa-check"></i></div>`;
                    else if (isSelected && !isCorrect) iconHtml = `<div class="flex-shrink-0 w-6 h-6 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-sm mt-0.5"><i class="fas fa-times"></i></div>`;
                    else if (!isSelected && isCorrect) iconHtml = `<div class="flex-shrink-0 w-6 h-6 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-sm mt-0.5"><i class="fas fa-check"></i></div>`;
                }

                btn.innerHTML = `
                    ${iconHtml}
                    <span class="text-gray-700 leading-relaxed">${opt}</span>
                `;
                optionsContainer.appendChild(btn);
            });
            
            const expContainer = document.getElementById('explanation-container');
            if (userAnswers[currentQuestionIndex] !== null) {
                const expText = currentLang === 'zh' ? q.explanationZh : q.explanationEn;
                const isCorrect = userAnswers[currentQuestionIndex] === q.answer;
                expContainer.innerHTML = `
                    <div class="p-4 rounded-xl ${isCorrect ? 'bg-green-50 border border-green-100' : 'bg-orange-50 border border-orange-100'}">
                        <p class="font-bold ${isCorrect ? 'text-green-800' : 'text-orange-800'} mb-1 flex items-center gap-2">
                            <i class="fas ${isCorrect ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${uiStrings[currentLang].explanation}
                        </p>
                        <p class="text-gray-700 text-sm leading-relaxed">${expText}</p>
                    </div>
                `;
                expContainer.classList.remove('hidden');
            } else {
                expContainer.classList.add('hidden');
            }
            
            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
            
            updateUI();
        }

        function selectOption(idx) {
            userAnswers[currentQuestionIndex] = idx;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            score = 0;
            let unanswered = 0;
            currentQuestions.forEach((q, i) => {
                if (userAnswers[i] === q.answer) score++;
                if (userAnswers[i] === null) unanswered++;
            });
            
            if (unanswered > 0) {
                showModal(`尚有 ${unanswered} 題未作答，確定要交卷嗎？\nThere are ${unanswered} unanswered questions. Submit anyway?`);
                const oldOkBtn = document.querySelector('#custom-modal button');
                const newOkBtn = oldOkBtn.cloneNode(true);
                oldOkBtn.parentNode.replaceChild(newOkBtn, oldOkBtn);
                
                newOkBtn.onclick = () => {
                    closeModal();
                    showResults();
                };
                
                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'w-full mt-2 inline-flex justify-center rounded-xl border border-gray-300 shadow-sm px-4 py-2.5 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:text-sm transition-colors';
                cancelBtn.innerText = '取消 (Cancel)';
                cancelBtn.onclick = () => {
                    closeModal();
                    newOkBtn.parentNode.removeChild(cancelBtn);
                    
                    const resetOkBtn = newOkBtn.cloneNode(true);
                    newOkBtn.parentNode.replaceChild(resetOkBtn, newOkBtn);
                    resetOkBtn.onclick = closeModal;
                };
                newOkBtn.parentNode.appendChild(cancelBtn);
                
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('question-container').classList.add('hidden');
            document.getElementById('quiz-controls').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            
            document.getElementById('final-score').innerText = `${score} / ${currentQuestions.length}`;
            
            const wrongList = document.getElementById('wrong-questions-list');
            wrongList.innerHTML = '';
            let hasWrong = false;
            
            currentQuestions.forEach((q, i) => {
                if (userAnswers[i] !== q.answer) {
                    hasWrong = true;
                    const qText = currentLang === 'zh' ? q.questionZh : q.questionEn;
                    const options = currentLang === 'zh' ? q.optionsZh : q.optionsEn;
                    const expText = currentLang === 'zh' ? q.explanationZh : q.explanationEn;
                    const userAnswerText = userAnswers[i] !== null ? options[userAnswers[i]] : uiStrings[currentLang].unanswered;
                    const correctAnswerText = options[q.answer];
                    
                    const item = document.createElement('div');
                    item.className = 'bg-slate-50 p-5 rounded-xl border border-slate-200';
                    item.innerHTML = `
                        <p class="font-bold text-gray-800 mb-3 flex gap-2">
                            <span class="text-red-500">Q${currentGlobalOffset + i + 1}.</span> 
                            <span class="whitespace-pre-line">${qText}</span>
                        </p>
                        <div class="space-y-2 text-sm mb-4 pl-6">
                            <p class="text-red-600 flex items-start gap-2"><i class="fas fa-times mt-1"></i> <span>你的答案：${userAnswerText}</span></p>
                            <p class="text-green-600 flex items-start gap-2"><i class="fas fa-check mt-1"></i> <span>正確答案：${correctAnswerText}</span></p>
                        </div>
                        <div class="bg-white p-4 rounded-lg border border-gray-100 text-sm">
                            <p class="font-bold text-gray-700 mb-1"><i class="fas fa-info-circle text-blue-400"></i> ${uiStrings[currentLang].explanation}：</p>
                            <p class="text-gray-600 leading-relaxed">${expText}</p>
                        </div>
                    `;
                    wrongList.appendChild(item);
                }
            });
            
            if (hasWrong) {
                document.getElementById('wrong-questions-section').classList.remove('hidden');
                document.getElementById('download-wrong-txt-btn').classList.remove('hidden');
            } else {
                document.getElementById('wrong-questions-section').classList.add('hidden');
                document.getElementById('download-wrong-txt-btn').classList.add('hidden');
            }
        }

        function downloadWrongQuestionsTXT() {
            let content = "";
            let hasWrong = false;
            
            currentQuestions.forEach((q, i) => {
                if (userAnswers[i] !== q.answer) {
                    hasWrong = true;
                    content += `Q${currentGlobalOffset + i + 1}: ${currentLang === 'zh' ? q.questionZh : q.questionEn}\n`;
                    
                    const options = currentLang === 'zh' ? q.optionsZh : q.optionsEn;
                    options.forEach((opt, idx) => {
                        content += `${String.fromCharCode(65 + idx)}. ${opt}\n`;
                    });
                    
                    const userAnswerText = userAnswers[i] !== null ? options[userAnswers[i]] : uiStrings[currentLang].unanswered;
                    const correctAnswerText = options[q.answer];
                    
                    content += `\n你的答案 (Your Answer): ${userAnswerText}\n`;
                    content += `正確答案 (Correct Answer): ${correctAnswerText}\n`;
                    content += `解釋 (Explanation): ${currentLang === 'zh' ? q.explanationZh : q.explanationEn}\n`;
                    content += `--------------------------------------------------\n\n`;
                }
            });
            
            if (!hasWrong) {
                showModal(uiStrings[currentLang].noWrongQuestions);
                return;
            }
            
            const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `Wrong_Questions_${currentRangeTargetId}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function goBack() {
            if (currentView === 'sections') {
                renderSubtopics();
            } else if (currentView === 'range') {
                renderSections(currentSubtopicId);
            } else if (currentView === 'quiz') {
                showRangeView(currentRangeTargetId, currentRangeTitleZh, currentRangeTitleEn);
            }
        }

        function goBackToRanges() {
            showRangeView(currentRangeTargetId, currentRangeTitleZh, currentRangeTitleEn);
        }

        // Initialize
        renderSubtopics();

    </script>
</body>
</html>
